<div class="para">An angle is said to be a <dfn class="terminology">right angle</dfn> if its measure is 90 degrees. Angles that have measures less than 90 degrees are said to be <dfn class="terminology">acute</dfn> and angles with measures greater than 90 degrees are said to be <dfn class="terminology">obtuse</dfn>.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-typesofangles-7-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
