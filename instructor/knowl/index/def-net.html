<div class="para">A <dfn class="terminology">net</dfn> for a polyhedron is a single-piece pattern for the polyhedron that can be folded and glued to form the solid. A net can be created by cutting the polyhedron along some of its edges and unfolding. There are multiple nets for each polyhedron.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-net-3-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
