</h2>
<div class="para">The <dfn class="terminology">area of a circle</dfn> is the interior space of a circle and is computed by the formula <span class="process-math">\(A=\pi r^2\)</span> where <span class="process-math">\(r\)</span> is the radius of the circle. The <dfn class="terminology">circumference</dfn> of a circle is the length of its boundary and is given by <span class="process-math">\(C=2\pi r\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-circle-measures-6-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
