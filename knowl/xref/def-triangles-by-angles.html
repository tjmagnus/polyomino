<div class="para">If one of its angles is obtuse, we say that a triangle is an <dfn class="terminology">obtuse triangle</dfn>. An <dfn class="terminology">acute triangle</dfn> is a triangle with three acute angles. We will explore the measurement of angles more in <a href="ch-polygons.html" class="internal" title="Chapter 2: Exploring Polygons and Other Figures on the Plane">Chapter 2</a> and <a href="ch-isom.html" class="internal" title="Chapter 4: Exploring Transformations">Chapter 4</a>.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-triangles-by-angles-5-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
