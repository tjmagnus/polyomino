<div class="para">As noted in <a href="sec-intro-apply.html#def-triangles-by-angles" class="xref" data-knowl="./knowl/xref/def-triangles-by-angles.html" data-reveal-label="Reveal" data-close-label="Close" title="Definition 1.2.16">Definition 1.2.16</a>, a <dfn class="terminology">right triangle</dfn> is a triangle with one right angle. The longest side, called the <dfn class="terminology">hypotenuse</dfn>, of a right triangle is always opposite the right angle. The other two sides of the right triangle are called the <dfn class="terminology">legs</dfn>.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-righttriangle-5-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
