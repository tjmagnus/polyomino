<div class="para logical">
<div class="para">The area <span class="process-math">\(A\)</span> of a rectangle is the product of its length <span class="process-math">\(\ell\)</span> and its width <span class="process-math">\(w\text{;}\)</span> in symbols,</div>
<div class="displaymath process-math">
\begin{equation*}
A=\ell \times w\text{.}
\end{equation*}
</div>
